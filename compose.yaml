services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quali
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quali_dev_only}
      POSTGRES_DB: quali
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-3435}:5432'
    volumes:
      - quali_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quali -d quali']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  quali_pgdata:
